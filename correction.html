<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report a correction — World Ichneumonidae Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Source Serif 4', Georgia, serif; } </style>
</head>
<body class="bg-white text-gray-600">

  <section class="container mx-auto p-4 sm:pt-10 max-w-2xl">

    <div class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">
        Report an error or correction
      </h1>
      <p class="mt-2 text-lg text-gray-500">
        Help keep the World Ichneumonidae Database accurate
      </p>
    </div>

    <div class="space-y-4">

      <div>
        <label for="taxon" class="block font-semibold text-gray-800 mb-1">
          Taxon / name concerned <span class="text-red-700">*</span>
        </label>
        <input id="taxon" type="text" placeholder="e.g. Pristomerus austrinus"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
      </div>

      <div>
        <label for="type" class="block font-semibold text-gray-800 mb-1">
          Type of problem <span class="text-red-700">*</span>
        </label>
        <select id="type"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-red-400">
          <option value="">— select —</option>
          <option value="Authorship">Authorship</option>
          <option value="Misspelling">Misspelling</option>
          <option value="Synonymy">Synonymy</option>
          <option value="Distribution">Distribution</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label for="details" class="block font-semibold text-gray-800 mb-1">
          Details <span class="text-red-700">*</span>
        </label>
        <textarea id="details" rows="5" placeholder="Describe what is incorrect and what it should be."
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400"></textarea>
      </div>

      <div>
        <label for="reference" class="block font-semibold text-gray-800 mb-1">
          Reference / source <span class="font-normal text-gray-500">(optional)</span>
        </label>
        <input id="reference" type="text" placeholder="A DOI or citation supporting the correction"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
      </div>

      <div>
        <label for="submitter" class="block font-semibold text-gray-800 mb-1">
          Your name <span class="font-normal text-gray-500">(optional)</span>
        </label>
        <input id="submitter" type="text"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
      </div>

      <!-- honeypot -->
      <input type="text" id="hp_field" tabindex="-1" autocomplete="off" aria-hidden="true"
        class="absolute -left-[9999px]" />

      <button id="submit"
        class="rounded-md bg-red-800 px-6 py-3 text-white font-medium hover:bg-red-900 focus:outline-none focus:ring-2 focus:ring-red-400 transition disabled:opacity-50">
        Submit correction
      </button>

      <div id="msg" class="mt-2 leading-relaxed whitespace-pre-wrap break-words"></div>
    </div>

    <p class="text-center text-sm text-gray-400 mt-10">World Ichneumonidae Database</p>

  </section>

  <script>
    const btn = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const val = id => document.getElementById(id).value.trim();

    btn.addEventListener('click', async () => {
      const taxon = val('taxon');
      const type = val('type');
      const details = val('details');
      if (!taxon || !type || !details) {
        msg.textContent = 'Please fill in the taxon, the type of problem, and the details.';
        msg.className = 'mt-2 text-red-700';
        return;
      }
      btn.disabled = true; msg.textContent = 'Submitting…'; msg.className = 'mt-2 text-gray-500';
      try {
        const r = await fetch('/.netlify/functions/submit-correction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            taxon, type, details,
            reference: val('reference'),
            name: val('submitter'),
            website: val('hp_field')
          })
        });
        if (!r.ok) {
          msg.textContent = 'Sorry, something went wrong on our end. Please try again in a moment.';
          msg.className = 'mt-2 text-red-700';
          return;
        }
        msg.textContent = 'Thank you — your correction was received. We appreciate it!';
        msg.className = 'mt-2 text-green-700 font-medium';
        ['taxon','type','details','reference','submitter'].forEach(id => document.getElementById(id).value = '');
      } catch (e) {
        msg.textContent = 'Network error — please check your connection and try again.';
        msg.className = 'mt-2 text-red-700';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
