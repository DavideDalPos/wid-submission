<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit a paper — World Ichneumonidae Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Source Serif 4', Georgia, serif; } </style>
</head>
<body class="bg-white text-gray-600">

  <section class="container mx-auto p-4 sm:pt-10 max-w-2xl">

    <div class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">
        Submit a published paper
      </h1>
      <p class="mt-2 text-lg text-gray-500">
        Help keep the World Ichneumonidae Database complete
      </p>
    </div>

    <div class="space-y-4">

      <div>
        <label for="authors" class="block font-semibold text-gray-800 mb-1">
          Author(s) <span class="text-red-700">*</span>
        </label>
        <input id="authors" type="text" placeholder="e.g. Dal Pos, D. &amp; Smith, J."
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="sm:col-span-1">
          <label for="year" class="block font-semibold text-gray-800 mb-1">Year</label>
          <input id="year" type="text" inputmode="numeric" placeholder="2026"
            class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
        </div>
        <div class="sm:col-span-2">
          <label for="journal" class="block font-semibold text-gray-800 mb-1">Journal / source</label>
          <input id="journal" type="text" placeholder="e.g. ZooKeys"
            class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
        </div>
      </div>

      <div>
        <label for="title" class="block font-semibold text-gray-800 mb-1">
          Title <span class="text-red-700">*</span>
        </label>
        <input id="title" type="text" placeholder="Full title of the publication"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
      </div>

      <div>
        <label for="doi" class="block font-semibold text-gray-800 mb-1">DOI</label>
        <input id="doi" type="text" placeholder="10.3897/zookeys.123.4567  (or full DOI link)"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
        <p class="text-sm text-gray-400 mt-1">Just the DOI is enough — we'll turn it into a link.</p>
      </div>

      <div>
        <label for="submitter" class="block font-semibold text-gray-800 mb-1">
          Your name <span class="font-normal text-gray-500">(optional)</span>
        </label>
        <input id="submitter" type="text"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
      </div>

      <!-- honeypot -->
      <input type="text" id="hp_field" tabindex="-1" autocomplete="off" aria-hidden="true"
        class="absolute -left-[9999px]" />

      <button id="submit"
        class="rounded-md bg-red-800 px-6 py-3 text-white font-medium hover:bg-red-900 focus:outline-none focus:ring-2 focus:ring-red-400 transition disabled:opacity-50">
        Submit paper
      </button>

      <div id="msg" class="mt-2 leading-relaxed whitespace-pre-wrap break-words"></div>
    </div>

    <p class="text-center text-sm text-gray-400 mt-10">World Ichneumonidae Database</p>

  </section>

  <script>
    const btn = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const val = id => document.getElementById(id).value.trim();

    btn.addEventListener('click', async () => {
      const authors = val('authors');
      const title = val('title');
      if (!authors || !title) {
        msg.textContent = 'Please fill in at least the author(s) and the title.';
        msg.className = 'mt-2 text-red-700';
        return;
      }
      btn.disabled = true; msg.textContent = 'Submitting…'; msg.className = 'mt-2 text-gray-500';
      try {
        const r = await fetch('/.netlify/functions/submit-paper', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            authors, title,
            year: val('year'),
            journal: val('journal'),
            doi: val('doi'),
            name: val('submitter'),
            website: val('hp_field')
          })
        });
        if (!r.ok) {
          msg.textContent = 'Sorry, something went wrong on our end. Please try again in a moment.';
          msg.className = 'mt-2 text-red-700';
          return;
        }
        msg.textContent = 'Thank you — your submission was received. We appreciate it!';
        msg.className = 'mt-2 text-green-700 font-medium';
        ['authors','year','journal','title','doi','submitter'].forEach(id => document.getElementById(id).value = '');
      } catch (e) {
        msg.textContent = 'Network error — please check your connection and try again.';
        msg.className = 'mt-2 text-red-700';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
