<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit a paper — World Ichneumonidae Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Source Serif 4', Georgia, serif; } </style>
</head>
<body class="bg-white text-gray-600">

  <section class="container mx-auto p-4 sm:pt-10 max-w-2xl">

    <!-- Title -->
    <div class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">
        Submit a published paper
      </h1>
      <p class="mt-2 text-lg text-gray-500">
        Help keep the World Ichneumonidae Database complete
      </p>
    </div>

    <!-- Intro callout, matching the site style -->
    <div class="bg-gray-100 border-l-4 border-red-800 p-4 rounded-md shadow-sm mb-8">
      <p class="text-gray-700 leading-relaxed">
        Know of a published paper that is not yet included in WID? Paste the full citation or a DOI below.
        No account is needed — your submission goes straight to our editorial team.
      </p>
    </div>

    <!-- Form -->
    <div class="space-y-4">
      <div>
        <label for="citation" class="block font-semibold text-gray-800 mb-1">
          Publication (full citation or DOI)
        </label>
        <textarea id="citation" rows="3"
          placeholder="Author(s), year, title, journal — or a DOI"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400"></textarea>
      </div>

      <div>
        <label for="name" class="block font-semibold text-gray-800 mb-1">
          Your name <span class="font-normal text-gray-500">(optional)</span>
        </label>
        <input id="name" type="text"
          class="w-full rounded-md border border-gray-300 p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400" />
      </div>

      <!-- honeypot: hidden from people, catches bots -->
      <input type="text" id="hp_field" tabindex="-1" autocomplete="off" aria-hidden="true"
        class="absolute -left-[9999px]" />

      <button id="submit"
        class="rounded-md bg-red-800 px-6 py-3 text-white font-medium hover:bg-red-900 focus:outline-none focus:ring-2 focus:ring-red-400 transition disabled:opacity-50">
        Submit paper
      </button>

      <div id="msg" class="mt-2 leading-relaxed whitespace-pre-wrap break-words"></div>
    </div>

    <p class="text-center text-sm text-gray-400 mt-10">
      World Ichneumonidae Database
    </p>

  </section>

  <script>
    const btn = document.getElementById('submit');
    const msg = document.getElementById('msg');
    btn.addEventListener('click', async () => {
      const citation = document.getElementById('citation').value.trim();
      if (!citation) { msg.textContent = 'Please enter a citation or DOI.'; msg.className = 'mt-2 text-red-700'; return; }
      btn.disabled = true; msg.textContent = 'Submitting…'; msg.className = 'mt-2 text-gray-500';
      try {
        const r = await fetch('/.netlify/functions/submit-paper', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            citation,
            name: document.getElementById('name').value,
            website: document.getElementById('hp_field').value
          })
        });
        if (!r.ok) {
          msg.textContent = 'Sorry, something went wrong on our end. Please try again in a moment.';
          msg.className = 'mt-2 text-red-700';
          return;
        }
        msg.textContent = 'Thank you — your submission was received. We appreciate it!';
        msg.className = 'mt-2 text-green-700 font-medium';
        document.getElementById('citation').value = '';
        document.getElementById('name').value = '';
      } catch (e) {
        msg.textContent = 'Network error — please check your connection and try again.';
        msg.className = 'mt-2 text-red-700';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
